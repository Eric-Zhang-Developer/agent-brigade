# The kit's own CI: unit tests on the Python floor, the checks on the kit itself, and both examples end to end.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      S: template/common/.agents/scripts
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Unit tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          python3 -m unittest discover -s tests -t tests -v

      - name: Kit checks
        run: |
          python3 $S/check_ownership.py --lint-specs
          python3 $S/check_markers.py --all

      - name: Examples end to end
        run: |
          for ex in examples/*/; do
            echo "::group::$ex"
            python3 $S/check_ownership.py --root "$ex" --lint-specs
            python3 $S/check_markers.py --root "$ex" --all
            python3 $S/status.py --root "$ex" --offline --out -
            python3 -m unittest discover -s "$ex" -t "$ex" -v
            echo "::endgroup::"
          done

      - name: npm package installs a working project
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj" && git init -q
          npx --yes "$RUNNER_TEMP"/agent-brigade-*.tgz --profile project --lite
          python3 .agents/scripts/check_ownership.py --lint-specs
          python3 .agents/scripts/status.py --offline --out - > /dev/null
