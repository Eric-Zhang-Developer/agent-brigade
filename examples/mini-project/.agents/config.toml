# Example only (kit repo). A toy side project ("jotter") in lite mode. See README.md.
profile = "project"
size = "lite"

[ownership]
frozen = [".agents/", "jotter/store.py"]
open = ["NOW.md"]

[agents]
max_parallel = 1

[pr]
warn_lines = 300

[verify]
# A CLI smoke run against a scratch notes file: add a note, then find it with a differently-cased search.
command = 'f=$(mktemp) && JOTTER_FILE=$f python3 -m jotter add "Buy milk" && JOTTER_FILE=$f python3 -m jotter search MILK | grep -q "Buy milk"'
