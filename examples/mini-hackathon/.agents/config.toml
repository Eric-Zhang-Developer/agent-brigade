# Example only (kit repo). A toy project ("wordfreq") showing a full hackathon run. See README.md.
profile = "hackathon"
size = "full"

[ownership]
frozen = [".agents/", "wordfreq/__init__.py", "tests/golden/", "tests/test_loop.py"]

[agents]
max_parallel = 2
reporter = "claude-1"

[pr]
warn_lines = 200

[verify]
# A CLI smoke run on a tiny file whose answer is known: "the" appears twice.
command = 'f=$(mktemp) && printf "the cat the hat\n" > "$f" && python3 -m wordfreq "$f" --top 1 | grep -q "^the"'
