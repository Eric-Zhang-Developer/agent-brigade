# agent-brigade CI. Installed by init.py. Make `ci` a required check in branch protection
# (profiles/hackathon/preflight.md). Keep it fast: a slow CI caps how fast anything merges.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]   # edited: fixing a PR title reruns the gates
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Spec lint
        run: python3 core/scripts/check_ownership.py --lint-specs

      - name: Ownership, gates, markers (PR)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          python3 core/scripts/check_ownership.py --title "$TITLE" --base "$BASE"
          python3 core/scripts/check_gates.py --title "$TITLE" --base "$BASE"
          python3 core/scripts/check_markers.py --base "$BASE"

      - name: Markers (main)
        if: github.event_name == 'push'
        run: python3 core/scripts/check_markers.py --all

      # Your project's own checks go below: tests, lint, build. Keep the golden test here.
      - name: Project checks
        run: echo "Add your test command here (see specs/tech-stack.md, Checks)"
