# Project milestones: a little of the hackathon deadline in everyday work. Enforced in CI by .agents/scripts/check_gates.py.
# A milestone ships on `ship`; for `freeze_days` before it, only its own features merge,
# and anything on its cut list is rejected. Leave `ship` empty for "no date yet" (no freeze).

[[milestone]]
name = "first-ship"
ship = ""                 # YYYY-MM-DD. Pick a date within 2–4 weeks; a date is the forcing function.
freeze_days = 2
features = []             # IDs that must land for this milestone
cut = []                  # IDs dropped from this milestone if late. Decide this now, not at the deadline.
